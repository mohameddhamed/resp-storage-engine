name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.22', '1.23' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify Dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Server & Benchmark Tool
        run: |
          go build -v -o bin/server ./app
          go build -v -o bin/bench ./cmd/bench
